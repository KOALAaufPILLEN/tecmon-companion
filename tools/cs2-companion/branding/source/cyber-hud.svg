<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <linearGradient id="neon"><stop stop-color="#62edff"/><stop offset=".45" stop-color="#7587ff"/><stop offset="1" stop-color="#c76bff"/></linearGradient>
 <linearGradient id="glass"><stop stop-color="#071622" stop-opacity=".96"/><stop offset="1" stop-color="#111426" stop-opacity=".48"/></linearGradient>
 <linearGradient id="fade"><stop stop-color="#76e8ff" stop-opacity=".6"/><stop offset="1" stop-color="#76e8ff" stop-opacity="0"/></linearGradient>
 <filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
