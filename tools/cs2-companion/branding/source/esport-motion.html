<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#00ff00}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
const W = 1280, H = 720, GREEN = '#00ff00';
const c = document.getElementById('c'), g = c.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
const logo = new Image(); logo.src = 'logo.webp';
const GOLD = '#efc96d', GOLD2 = '#b8862e', PURPLE = '#8b4dff', CYAN = '#5ee7ff', NAVY = '#070b1a';
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const easeIn = (x) => Math.pow(Math.min(1, Math.max(0, x)), 2);
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function hexGrid(ctx, t, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = 'rgba(94,231,255,0.10)'; ctx.lineWidth = 1;
  const r = 26, hw = Math.sqrt(3) * r;
  for (let row = -1; row < H / (r * 1.5) + 1; row++)
    for (let col = -1; col < W / hw + 1; col++) {
      const x = col * hw + (row % 2 ? hw / 2 : 0), y = row * r * 1.5;
      const pulse = 0.5 + 0.5 * Math.sin(t * 2 + x * 0.01 + y * 0.013);
      ctx.globalAlpha = alpha * (0.4 + 0.6 * pulse);
      ctx.beginPath();
      for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k + Math.PI / 6; ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); }
      ctx.closePath(); ctx.stroke();
    }
  ctx.restore();
}
function panel(ctx, pts, fill, edge) {
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill(); if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = 3; ctx.stroke(); }
}
// ---- TITLE CARD (mode=title): 0-0.9 build, 0.9-3.0 hold, 3.0-4.5 shatter ----
function drawTitle(ctx, t) {
  const bg = ctx.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#0b1030'); bg.addColorStop(0.5, NAVY); bg.addColorStop(1, '#1a0b33');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  hexGrid(ctx, t, ease(t / 0.6));
  // diagonal accent stripes
  ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = PURPLE;
  for (let i = 0; i < 7; i++) { const x = -400 + i * 260 + ((t * 60) % 260); panel(ctx, [[x, H], [x + 60, H], [x + 360, 0], [x + 300, 0]], PURPLE); }
  ctx.restore();
  // side panels slam in
  const a = ease((t - 0.05) / 0.45), b = ease((t - 0.15) / 0.45);
  panel(ctx, [[-W * 0.6 + a * W * 0.6, 0], [W * 0.30 - (1 - a) * W, 0], [W * 0.18 - (1 - a) * W, H], [-W * 0.6 + a * W * 0.6, H]], 'rgba(18,14,44,0.92)', null);
  panel(ctx, [[W + W * 0.6 - b * W * 0.6, 0], [W * 0.82 + (1 - b) * W, 0], [W * 0.70 + (1 - b) * W, H], [W + W * 0.6 - b * W * 0.6, H]], 'rgba(18,14,44,0.92)', null);
  // gold slashes on panel edges
  ctx.save(); ctx.strokeStyle = GOLD; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(W * 0.30 - (1 - a) * W, 0); ctx.lineTo(W * 0.18 - (1 - a) * W, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W * 0.82 + (1 - b) * W, 0); ctx.lineTo(W * 0.70 + (1 - b) * W, H); ctx.stroke();
  ctx.restore();
  // center banner expands from middle
  const k = ease((t - 0.45) / 0.45);
  const bw = W * 0.80 * k, bx = (W - bw) / 2, by = H * 0.40, bh = H * 0.24;
  if (k > 0) {
    const cut = 26;
    const grd = ctx.createLinearGradient(0, by, 0, by + bh); grd.addColorStop(0, '#141a3d'); grd.addColorStop(1, '#0a0d22');
    panel(ctx, [[bx + cut, by], [bx + bw, by], [bx + bw - cut, by + bh], [bx, by + bh]], grd, null);
    ctx.save(); ctx.strokeStyle = GOLD; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(bx + cut, by); ctx.lineTo(bx + bw, by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, by + bh); ctx.lineTo(bx + bw - cut, by + bh); ctx.stroke();
    ctx.fillStyle = PURPLE; ctx.fillRect(bx + cut, by - 7, Math.min(180, bw * 0.25), 4); ctx.fillRect(bx + bw - cut - Math.min(180, bw * 0.25), by + bh + 4, Math.min(180, bw * 0.25), 4);
    // chevrons
    ctx.fillStyle = GOLD;
    for (let i = 0; i < 3; i++) {
      const ax = bx - 30 - i * 18 + 10 * Math.sin(t * 5), ay = by + bh / 2;
      ctx.globalAlpha = k * (1 - i * 0.28); panel(ctx, [[ax, ay - 14], [ax + 10, ay - 14], [ax + 22, ay], [ax + 10, ay + 14], [ax, ay + 14], [ax + 12, ay]], GOLD);
      const zx = bx + bw + 30 + i * 18 - 10 * Math.sin(t * 5);
      panel(ctx, [[zx, ay - 14], [zx - 10, ay - 14], [zx - 22, ay], [zx - 10, ay + 14], [zx, ay + 14], [zx - 12, ay]], GOLD);
    }
    ctx.restore();
    ctx.save(); ctx.strokeStyle = GOLD; ctx.lineWidth = 4; ctx.shadowColor = GOLD; ctx.shadowBlur = 14 * k;
    const br = 34; [[bx + cut - 6, by - 14, 1, 1], [bx + bw + 6, by - 14, -1, 1], [bx - 6, by + bh + 14, 1, -1], [bx + bw - cut + 6, by + bh + 14, -1, -1]].forEach(([x, y, sx, sy]) => {
      ctx.beginPath(); ctx.moveTo(x + sx * br, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy * br * 0.6); ctx.stroke(); });
    ctx.restore();
    // light sweep along banner
    const sx = bx + ((t - 0.9) / 1.6 % 1) * (bw + 400) - 200;
    if (t > 0.9) { ctx.save(); ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.clip();
      const sw = ctx.createLinearGradient(sx - 120, 0, sx + 120, 0); sw.addColorStop(0, 'rgba(239,201,109,0)'); sw.addColorStop(0.5, 'rgba(239,201,109,0.16)'); sw.addColorStop(1, 'rgba(239,201,109,0)');
      ctx.fillStyle = sw; ctx.fillRect(bx, by, bw, bh); ctx.restore(); }
  }
  // logo drops in at top
  const l = ease((t - 0.6) / 0.4);
  if (l > 0 && logo.complete) { const s = 150 * (1.25 - 0.25 * l); ctx.save(); ctx.globalAlpha = l; ctx.drawImage(logo, (W - s) / 2, H * 0.09 + (1 - l) * -30, s, s); ctx.restore(); }
  // top/bottom bars
  const bar = ease((t - 0.2) / 0.5);
  ctx.fillStyle = GOLD; ctx.fillRect(W / 2 - W * 0.42 * bar, H * 0.90, W * 0.84 * bar, 2);
  ctx.fillStyle = CYAN; ctx.globalAlpha = 0.6; ctx.fillRect(W / 2 - W * 0.2 * bar, H * 0.92, W * 0.4 * bar, 2); ctx.globalAlpha = 1;
  // particles
  const r = rnd(7);
  for (let i = 0; i < 70; i++) { const px = r() * W, py = (r() * H - t * (20 + r() * 40)) % H; ctx.fillStyle = r() > 0.5 ? 'rgba(239,201,109,0.5)' : 'rgba(139,77,255,0.5)'; ctx.fillRect(px, (py + H) % H, 2, 2); }
  // flash at lock
  const f = Math.max(0, 1 - Math.abs(t - 0.92) / 0.12);
  if (f > 0) { ctx.fillStyle = `rgba(255,240,200,${0.35 * f})`; ctx.fillRect(0, 0, W, H); }
}
// shards: triangulated jittered grid
const shards = (() => { const r = rnd(42), cols = 12, rows = 7, pts = [];
  for (let y = 0; y <= rows; y++) for (let x = 0; x <= cols; x++) {
    const jx = (x > 0 && x < cols) ? (r() - 0.5) * W / cols * 0.7 : 0, jy = (y > 0 && y < rows) ? (r() - 0.5) * H / rows * 0.7 : 0;
    pts.push([x * W / cols + jx, y * H / rows + jy]); }
  const tri = [], at = (x, y) => pts[y * (cols + 1) + x];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const p = [at(x, y), at(x + 1, y), at(x + 1, y + 1), at(x, y + 1)];
    const d = r() > 0.5; const A = d ? [p[0], p[1], p[2]] : [p[0], p[1], p[3]], B = d ? [p[0], p[2], p[3]] : [p[1], p[2], p[3]];
    for (const T of [A, B]) { const cx = (T[0][0] + T[1][0] + T[2][0]) / 3, cy = (T[0][1] + T[1][1] + T[2][1]) / 3;
      const dist = Math.hypot(cx - W / 2, cy - H / 2) / Math.hypot(W / 2, H / 2);
      tri.push({ T, cx, cy, delay: dist * 0.45 + r() * 0.15, vx: (cx - W / 2) * (1.2 + r()), vy: (cy - H / 2) * (1.2 + r()) - 80, rot: (r() - 0.5) * 5, z: 1 + r() * 1.5 }); } }
  return tri; })();
function shatter(t0, p) { // p: 0..1 progress of shatter
  const q = (s) => easeIn((p - s.delay) / 0.55);
  const path = (T, grow) => { g.beginPath(); const cx = (T[0][0] + T[1][0] + T[2][0]) / 3, cy = (T[0][1] + T[1][1] + T[2][1]) / 3;
    T.forEach(([x, y], i) => { const X = cx + (x - cx) * grow, Y = cy + (y - cy) * grow; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.closePath(); };
  g.drawImage(off, 0, 0);
  g.fillStyle = GREEN;
  for (const s of shards) if (q(s) > 0) { path(s.T, 1.06); g.fill(); }
  for (const s of shards) {
    const k = q(s); if (k <= 0 || k >= 1) continue;
    g.save();
    g.translate(s.cx + s.vx * k, s.cy + s.vy * k); g.rotate(s.rot * k); g.scale(1 + (s.z - 1) * k, 1 + (s.z - 1) * k); g.translate(-s.cx, -s.cy);
    path(s.T, 1); g.clip(); g.drawImage(off, 0, 0);
    g.strokeStyle = GOLD; g.lineWidth = 3; g.stroke();
    g.restore();
  }
}
// ---- STINGER (mode=stinger): 0-0.3 green, slash in to cover 1.0-1.8, slash out by 2.6 ----
function drawStinger(t) {
  g.fillStyle = GREEN; g.fillRect(0, 0, W, H);
  const layers = [[GOLD, 0.00], [PURPLE, 0.07], ['#141a3d', 0.14]];
  const inP = (d) => ease((t - 0.25 - d) / 0.55), outP = (d) => easeIn((t - 1.85 - (0.14 - d)) / 0.5);
  for (const [col, d] of layers) {
    const pi = inP(d), po = outP(d);
    if (pi <= 0 || po >= 1) continue;
    const skew = 260, left = W + skew - pi * (W + 2 * skew) - po * (W + 2 * skew), right = left + W + 2 * skew;
    const x0 = Math.max(-skew * 2, left), x1 = right;
    g.beginPath(); g.moveTo(x0 + skew, 0); g.lineTo(x1 + skew, 0); g.lineTo(x1 - skew, H); g.lineTo(x0 - skew, H); g.closePath();
    g.fillStyle = col; g.fill();
    if (col === '#141a3d') { const L = left + skew; g.save(); g.clip(); g.fillStyle = '#0d1230'; g.fillRect(-W, 0, 3 * W, H); hexGrid(g, t, 1);
      g.strokeStyle = GOLD; g.lineWidth = 3; const cy = H * 0.5;
      g.beginPath(); g.moveTo(L + W * 0.10, cy - 70); g.lineTo(L + W * 0.90, cy - 70); g.stroke();
      g.beginPath(); g.moveTo(L + W * 0.10, cy + 70); g.lineTo(L + W * 0.90, cy + 70); g.stroke();
      g.fillStyle = PURPLE; g.fillRect(L + W * 0.10, cy - 78, 160, 4); g.fillRect(L + W * 0.90 - 160, cy + 74, 160, 4);
      if (logo.complete) g.drawImage(logo, L + W / 2 - 55, H * 0.13, 110, 110);
      g.restore(); }
    g.fillStyle = 'rgba(255,255,255,0.85)'; g.fillRect(left - 8 + skew, 0, 0, 0);
    g.save(); g.strokeStyle = col === GOLD ? '#fff3c4' : GOLD; g.lineWidth = 4; g.beginPath(); g.moveTo(x0 + skew, 0); g.lineTo(x0 - skew, H); g.stroke(); g.restore();
  }
}
window.render = (mode, t) => {
  if (mode === 'title') {
    if (t < 3.0) { drawTitle(g, t); }
    else { o.clearRect(0, 0, W, H); drawTitle(o, 3.0); shatter(3.0, (t - 3.0) / 1.3); }
  } else drawStinger(t);
};
window.ready = new Promise((r) => { logo.onload = r; if (logo.complete) r(); });
</script></body></html>
