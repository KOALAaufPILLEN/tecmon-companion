name: Windows release installer
# Baut Setup-EXE und Update-EXE und veröffentlicht sie als GitHub-Release.
# Automatisch: bei jedem Push auf main, wenn package.json eine Version trägt,
# zu der es noch kein Tag gibt (Version vorher mit `node scripts/version.mjs set x.y.z` erhöhen).
# Manuell: ein bestehendes Tag neu bauen und dessen Release-Dateien ersetzen.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Bestehendes Tag neu bauen (leer = aktuelle Version von main, falls noch nicht veröffentlicht)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: companion-release-installer
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Decide whether a new release is needed
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node scripts/version.mjs check)
          if [[ -n "${INPUT_TAG:-}" ]]; then
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Ungültiges Tag $INPUT_TAG"; exit 1; }
            git ls-remote --exit-code --tags origin "refs/tags/$INPUT_TAG" >/dev/null || { echo "Tag $INPUT_TAG existiert nicht"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "Baue bestehendes Tag $INPUT_TAG neu."
            exit 0
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$tag ist bereits veröffentlicht, nichts zu tun."
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Neue Version $tag aus $GITHUB_SHA."
  build:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-tools
          persist-credentials: false
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        run: |
          if($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$'){throw 'Invalid release tag'}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.ref }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: akiver/cs-demo-manager
          ref: v3.20.1
          path: csdm-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and tests
        working-directory: source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        run: |
          $package=Get-Content package.json -Raw|ConvertFrom-Json
          if(('v'+$package.version) -ne $env:RELEASE_TAG){throw 'Tag/version mismatch'}
          npm ci --ignore-scripts
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
          npm test
          if($LASTEXITCODE -ne 0){throw 'Tests failed'}
      - name: Prepare original Node runtime and build-only 7-Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory cache,runtime -Force|Out-Null
          Copy-Item -LiteralPath 'C:/Program Files/7-Zip' -Destination cache/7zip -Recurse
          $name='node-v26.13.0-win-x64.zip'
          Invoke-WebRequest "https://nodejs.org/dist/v26.13.0/$name" -OutFile "runtime/$name"
          $sums=(Invoke-WebRequest 'https://nodejs.org/dist/v26.13.0/SHASUMS256.txt').Content
          $expected=($sums -split "`n"|Where-Object {$_ -match ('\s+'+[regex]::Escape($name)+'\s*$')}) -split '\s+'|Select-Object -First 1
          if(!$expected -or (Get-FileHash "runtime/$name").Hash -ine $expected){throw 'Node runtime checksum mismatch'}
          Expand-Archive -LiteralPath "runtime/$name" -DestinationPath runtime
      - name: Build setup and updater from the release source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        run: |
          $base=$PWD.Path
          & ./source/scripts/build-companion-installer.ps1 -DependenciesCache "$base/cache" -CsDmSource "$base/csdm-source" -NodeFolder "$base/runtime/node-v26.13.0-win-x64" -BuildDirectory "$base/build" -OutputDirectory "$base/dist" -DownloadVideoTools
          & ./source/scripts/build-companion-update.ps1 -ApplicationDirectory "$base/build/app" -BuildDirectory "$base/update-build" -OutputDirectory "$base/dist" -Version $env:RELEASE_TAG.Substring(1)
      - name: Verify pristine payload and isolated first installation
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        run: |
          node ./build-tools/scripts/test-release-installer.mjs "dist/TecMon-Companion-Setup-$($env:RELEASE_TAG.Substring(1)).exe" "$env:RUNNER_TEMP/tecmon-installation-test" $env:RELEASE_TAG.Substring(1) "source/tools/cs2-companion/branding/TecMon-Branding-v3.json"
          if($LASTEXITCODE -ne 0){throw 'Installer smoke test failed'}
          Copy-Item -LiteralPath source/tools/cs2-companion/branding/TecMon-Branding-v3.json -Destination dist/TecMon-Branding-v3.json
          $name="TecMon-Companion-Setup-$($env:RELEASE_TAG.Substring(1)).exe"
          ((Get-FileHash "dist/$name").Hash.ToLowerInvariant()+'  '+$name)|Set-Content "dist/$name.sha256" -Encoding utf8
          $sums=Get-ChildItem dist -File|Where-Object {$_.Extension -in @('.exe','.json')}|ForEach-Object {(Get-FileHash $_.FullName).Hash.ToLowerInvariant()+'  '+$_.Name}
          $sums|Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: verified-installer
          path: dist/*
          retention-days: 7
  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-installer
          path: dist
      - name: Publish verified setup and update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          RELEASE_REF: ${{ needs.detect.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (cd dist && sha256sum --check *.sha256)
          (cd dist && sha256sum --check SHA256SUMS.txt)
          version="${RELEASE_TAG#v}"
          for name in "TecMon-Companion-Setup-$version.exe" "TecMon-Companion-Update-$version.exe" TecMon-Companion-Update.json; do
            [[ -s "dist/$name" ]] || { echo "$name fehlt"; exit 1; }
          done
          # Kopien mit festem Namen: releases/latest/download/TecMon-Companion-Setup.exe
          # fuehrt so immer zur neuesten Version (Download-Seite auf tecmon.online).
          # Nicht in den Pruefsummen-Dateien, damit Updater und Manifest unveraendert bleiben.
          cp "dist/TecMon-Companion-Setup-$version.exe" dist/TecMon-Companion-Setup.exe
          cp "dist/TecMon-Companion-Update-$version.exe" dist/TecMon-Companion-Update.exe
          if ! gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            # Erst als Entwurf anlegen: Der Companion sieht das Update erst, wenn alle Dateien hochgeladen sind.
            gh release create "$RELEASE_TAG" --draft --target "$RELEASE_REF" --title "TecMon Companion $version" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
