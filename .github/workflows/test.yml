name: Companion tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Test TecMon demo rewriter
        if: runner.os == 'Linux'
        run: |
          cargo test --release --locked --manifest-path native/tecmon-demo-rewriter/Cargo.toml
          cd native/tecmon-demo-rewriter/vendor/source2-demo && cargo test --lib --no-default-features --features cs2
      - name: Build TecMon demo rewriter for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path native/tecmon-demo-rewriter/Cargo.toml
          if($LASTEXITCODE -ne 0) { throw 'Rewriter build failed' }
          # Wie im Release: das Update-Paket muss die Rewriter-Exe enthalten und einspielen können.
          Copy-Item -LiteralPath native/tecmon-demo-rewriter/target/release/tecmon-demo-rewriter.exe -Destination tools/cs2-companion/tecmon-demo-rewriter.exe
      - name: Compile native launcher and run self-test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $output=Join-Path $env:RUNNER_TEMP 'TecMon Companion.exe'
          $native=(Resolve-Path -LiteralPath 'tools/cs2-companion/windows/TecMon.cs').Path
          & $compiler /nologo /target:winexe /platform:x64 /optimize+ /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Web.Extensions.dll /r:Microsoft.CSharp.dll ("/resource:"+(Resolve-Path -LiteralPath 'tools/cs2-companion/windows/desktop-bot-model.zip').Path+",TecMonModel") ("/resource:"+(Resolve-Path -LiteralPath 'tools/cs2-companion/public/desktop-bot-3d.png').Path+",TecMonBot3D") "/out:$output" ("/win32icon:"+(Resolve-Path -LiteralPath 'tools/cs2-companion/windows/tecmon.ico').Path) $native
          if($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          $test=Start-Process -FilePath $output -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if($test.ExitCode -ne 0) { throw 'Native self-test failed' }
          # Universelles Overlay ohne CS2: echte WinForms, Fokus, Alpha, Filter und Hotkeys.
          $crosshairTest=Join-Path $env:RUNNER_TEMP 'CrosshairSelfTest.exe'
          & $compiler /nologo /target:exe /main:CrosshairSelfTest /platform:x64 /optimize+ /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Web.Extensions.dll /r:Microsoft.CSharp.dll "/out:$crosshairTest" $native (Resolve-Path -LiteralPath 'tools/cs2-companion/windows/CrosshairSelfTest.cs').Path
          if($LASTEXITCODE -ne 0) { throw 'Crosshair test compilation failed' }
          $crosshairOutput=Join-Path $env:RUNNER_TEMP 'crosshair-test'
          $crosshair=Start-Process -FilePath $crosshairTest -ArgumentList $crosshairOutput -WindowStyle Hidden -Wait -PassThru
          if($crosshair.ExitCode -ne 0) { throw 'Native crosshair test failed' }
          Get-Content -LiteralPath (Join-Path $crosshairOutput 'crosshair-native-test.txt')
          # Echtzeit-3D-Figur: Modell laden, einige Bilder zeichnen und die Zeit je Bild ausgeben.
          $preview=Join-Path $env:RUNNER_TEMP 'figure-preview'
          New-Item -ItemType Directory -Path $preview -Force | Out-Null
          $model=Start-Process -FilePath $output -ArgumentList '--desktop-preview-model',$preview -WindowStyle Hidden -Wait -PassThru
          if($model.ExitCode -ne 0) { throw '3D-Figur konnte nicht gezeichnet werden' }
          Get-Content -LiteralPath (Join-Path $preview 'timing.txt')
          if((Get-ChildItem -LiteralPath $preview -Filter 'model-*.png').Count -ne 9) { throw '3D-Vorschaubilder fehlen' }
      - name: Verify native file update preserves user data
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-companion-update.ps1

      - name: Verify render file locks and checksum rejection
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-companion-render-lock.ps1
