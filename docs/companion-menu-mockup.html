<div id="tm-companion-concept">
  <style>
    #tm-companion-concept{--tm-bg:#0c0914;--tm-panel:#161020;--tm-line:#58416f;--tm-gold:#e9c872;--tm-purple:#bca0fa;--tm-text:#f0eafa;--tm-muted:#c0b2cf;--tm-space:18px;color:var(--tm-text);font:14px/1.5 system-ui,sans-serif;color-scheme:dark}

    const make=(tag,text)=>{const e=document.createElement(tag);if(text)e.textContent=text;return e;};
    const ignored=new Set(['figure-motion','gameEconomy','high','low']);
    const modes={still:['Stillstand','Bleibt an seinem Platz'],chill:['Chillig','Sanfter Randflug'],hyper:['Hyperaktiv','Mehr Tempo & Tricks']};
    root.querySelectorAll('.tm-window').forEach((app,variant)=>{
      const state={group:'games',game:'cs2',motion:'chill',quality:'high',economy:true};
      app.innerHTML='<header class="tm-top"><strong class="tm-brand">TECMON</strong><small>COMPANION · MENÜENTWURF</small></header><div class="tm-layout"><nav class="tm-nav" aria-label="Companion-Bereiche"></nav><main class="tm-main"></main><aside class="tm-preview" aria-label="Begleiter-Vorschau"><h3>DEIN TECMON</h3><div class="tm-screen" role="img" aria-label="Flug am Bildschirmrand, freie Spielmitte"><div class="tm-safe">Spielmitte<br>bleibt frei</div><img class="tm-bot" alt="TecMon mit metallischer Oberfläche"></div><div class="tm-speech" role="status" aria-live="polite">Alles da. Nichts im Weg.</div><small>Sprechblasen bekommen eigenen Platz. Das Menü verdeckt keine Witze.</small><button type="button" class="tm-game-test">Spielstart testen</button></aside></div><footer class="tm-footer"><span>Alle vorhandenen Bereiche bleiben erreichbar</span><span>Vorschau · keine echten Einstellungen geändert</span></footer>';
      app.querySelector('.tm-bot').src=img;
      const nav=app.querySelector('.tm-nav'),main=app.querySelector('.tm-main'),speech=app.querySelector('.tm-speech'),bot=app.querySelector('.tm-bot');
      let timer=0;
      function say(text){clearTimeout(timer);speech.textContent=text;}
      function move(kind){
        const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
        if(reduced||kind==='still')return;
        bot.getAnimations().forEach(a=>a.cancel());
        const left=Math.max(0,bot.parentElement.clientWidth-70)+'px',top=Math.max(0,bot.parentElement.clientHeight-46)+'px';
        bot.animate(kind==='trick'?[{transform:'rotateY(0deg)'},{transform:'rotateY(180deg) translateY(-12px)'},{transform:'rotateY(360deg)'}]:[{right:'0px',bottom:'0px'},{right:'0px',bottom:top},{right:left,bottom:top},{right:left,bottom:'0px'},{right:'0px',bottom:'0px'}],{duration:kind==='hyper'?1800:kind==='trick'?1200:4200,iterations:1,easing:'ease-in-out'});
      }
      function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{menu:state.group,game:state.game,motion:state.motion,quality:state.quality,gameEconomy:state.economy},privateContent:null}).catch(()=>{});}
      function renderControls(section,parent){
        const detail=make('details');detail.className='tm-details';detail.dataset.source=section.id;
        const summary=make('summary',names[section.id]||section.title);summary.append(make('small',section.controls.length+' Optionen'));detail.append(summary);
        const fields=make('div');fields.className='tm-fields';
        section.controls.filter(c=>!ignored.has(c.id)).forEach((c,i)=>{
          let field;const label=make('label');const id='tm-'+variant+'-'+section.id+'-'+i;label.htmlFor=id;
          if(c.kind==='button'||c.kind==='submit'||c.kind==='file'){field=make('button',c.label);field.type='button';field.addEventListener('click',()=>say('Vorschau: '+c.label+' – hier bleibt alles lokal.'));fields.append(field);return;}
          label.append(make('span',c.label));
          if(c.kind==='select'){field=make('select');for(const option of c.options){const e=make('option',option.label);e.value=option.value;field.append(e);}}
          else if(c.kind==='textarea'){field=make('textarea');field.rows=2;}
          else {field=make('input');field.type=['checkbox','range','number','color'].includes(c.kind)?c.kind:'text';if(field.type==='range'){field.min='0';field.max='100';field.value='50';}if(field.type==='checkbox')label.classList.add('tm-check');}
          field.id=id;field.addEventListener('change',()=>say('Vorschau geändert: '+c.label));label.append(field);fields.append(label);
        });
        detail.append(fields);detail.addEventListener('toggle',()=>{if(detail.open)main.querySelectorAll('.tm-details').forEach(d=>{if(d!==detail)d.open=false;});});parent.append(detail);
      }
      function show(){
        const group=groups.find(g=>g.id===state.group);nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===group.id?'page':'false'));
        main.replaceChildren();const kicker=make('span',state.group==='buddy'?'METALLKOPF. EIGENER CHARAKTER.':'ALLES AN SEINEM PLATZ');kicker.className='tm-kicker';main.append(kicker,make('h2',group.name),make('p',group.note));
        if(state.group==='buddy'){
          const choices=make('div');choices.className='tm-modes';
          for(const [key,[title,note]] of Object.entries(modes)){const button=make('button',title);button.type='button';button.setAttribute('aria-pressed',String(state.motion===key));button.append(make('small',note));button.addEventListener('click',()=>{state.motion=key;say(title+' · '+note);show();move(key);save();});choices.append(button);}main.append(choices);
          const quality=make('div');quality.className='tm-inline';quality.setAttribute('role','group');quality.setAttribute('aria-label','Darstellung');
          for(const [key,title] of [['high','3D in Echtzeit'],['low','Sparsame Bilder']]){const b=make('button',title);b.type='button';b.setAttribute('aria-pressed',String(state.quality===key));b.addEventListener('click',()=>{state.quality=key;show();say(title+' ausgewählt. Der Metall-Look bleibt.');save();});quality.append(b);}main.append(quality);
          const label=make('label');label.className='tm-setting';label.append(make('span','Beim Spielen automatisch sparsam – mit kurzer Verwandlung'));const toggle=make('input');toggle.type='checkbox';toggle.checked=state.economy;toggle.addEventListener('change',()=>{state.economy=toggle.checked;say(toggle.checked?'Spielstart: kurz verwandeln, danach sparsam.':'Deine gewählte Darstellung bleibt auch im Spiel aktiv.');save();});label.append(toggle);main.append(label);
          const actions=make('div');actions.className='tm-inline';for(const [text,run] of [['Trick zeigen',()=>{say('Gleicher Metallkopf. Neue Tricks.');move('trick');}],['Erzähl einen Witz',()=>say('Ich wollte gerade deine CPU aufwärmen. Hab dann gesehen: Du spielst schon.')]]){const b=make('button',text);b.type='button';b.addEventListener('click',run);actions.append(b);}main.append(actions);
        }
        let visibleIds=group.ids;
        if(state.group==='games'){
          const picker=make('div');picker.className='tm-inline';picker.setAttribute('role','group');picker.setAttribute('aria-label','Spiel wählen');
          for(const game of gamePages){const b=make('button',game.name);b.type='button';b.setAttribute('aria-pressed',String(state.game===game.id));b.addEventListener('click',()=>{state.game=game.id;show();save();});picker.append(b);}main.append(picker);
          const game=gamePages.find(g=>g.id===state.game);main.append(make('h3',game.name));visibleIds=game.ids;
        }
        for(const id of visibleIds){const section=sections.find(s=>s.id===id);if(section)renderControls(section,main);}
        if(state.group==='games'){
          const game=gamePages.find(g=>g.id===state.game),packs=sections.find(s=>s.id==='packs');
          renderControls({...packs,title:game.name+' · Paket verwalten',controls:packs.controls.filter(c=>c.label.startsWith(game.pack+' '))},main);
        }
      }
      groups.forEach(group=>{const b=make('button',group.name);b.type='button';b.dataset.page=group.id;b.addEventListener('click',()=>{state.group=group.id;show();save();});nav.append(b);});
      app.querySelector('.tm-game-test').addEventListener('click',()=>{if(!state.economy){say('Automatischer Sparmodus ist aus. Deine Darstellung bleibt erhalten.');return;}say('TecMon entwickelt sich zuuuuuuu …');move('trick');timer=setTimeout(()=>{say('TecMon! Sorry, gleicher Typ. Weniger Ressourcen. Mehr FPS für dich.');},2100);});
      function restore(saved){if(!saved||typeof saved!=='object')return;if(saved.motion in modes)state.motion=saved.motion;if(groups.some(g=>g.id===saved.menu))state.group=saved.menu;if(gamePages.some(g=>g.id===saved.game))state.game=saved.game;if(saved.quality==='high'||saved.quality==='low')state.quality=saved.quality;if(typeof saved.gameEconomy==='boolean')state.economy=saved.gameEconomy;}
      restore(window.openai?.widgetState?.modelContent);
      window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState?.modelContent);show();});
      show();
    });
    const design={spacing:18};if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--tm-space',design.spacing+'px')});tweak.addSlider(design,'spacing',{label:'Abstand im Menü',min:12,max:24,step:2,unit:'px'});}
  })();
  </script>
